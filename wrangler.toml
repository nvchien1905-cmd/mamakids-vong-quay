name = "mamakids-vong-quay"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# ── Static assets (file HTML) ────────────────────────────────
# Thư mục public/ chứa mamakids-vong-quay.html
[assets]
directory = "./public"
binding   = "ASSETS"

# ── Cloudflare KV (lưu lịch sử quay thưởng) ─────────────────
[[kv_namespaces]]
binding = "HISTORY_KV"
id      = "77781d0b87f64d96b5c7f61b41368ec1"

# ── Secrets (đặt qua CLI, không lưu ở đây) ───────────────────
# npx wrangler secret put GOOGLE_CREDENTIALS_JSON
# (Dán nội dung file credentials.json khi được hỏi)
